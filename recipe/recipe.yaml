context:
  name: cyclebane
  version: "26.9.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cyclebane-${{ version }}.tar.gz
  sha256: 60ad6bf20cf0e4fd0217c3f56aaf83ed8e90e14497dca5875f84a4b81cab4c1a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - networkx

tests:
  - python:
      imports:
        - cyclebane
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Transform directed acyclic graphs using map-reduce and groupby operations
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/cyclebane
  homepage: https://scipp.github.io/cyclebane/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
